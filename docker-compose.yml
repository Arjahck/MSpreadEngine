services:
  mspread-engine:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - MSPREAD_API_KEY=${MSPREAD_API_KEY:-}
    networks:
      - mspread-network
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload

networks:
  mspread-network:
    driver: bridge
