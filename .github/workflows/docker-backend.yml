name: Build and Publish Docker Image

on:
  push:
    branches: [ master, main ]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'main.py'
      - 'api/**'
      - 'malware_engine/**'
      - 'network_model/**'
      - 'simulation/**'
      - '.github/workflows/docker-backend.yml'
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert owner to lowercase
        id: lowercase
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          DOCKER_IMAGE=ghcr.io/${{ steps.lowercase.outputs.owner }}/mspreadengine
          VERSION=latest
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ $GITHUB_REF == refs/heads/* ]]; then
            VERSION=$(echo ${GITHUB_REF#refs/heads/} | sed -r 's#/+#-#g')
          fi
          TAGS="${DOCKER_IMAGE}:${VERSION}"
          if [[ $GITHUB_EVENT_NAME == 'push' && $GITHUB_REF == 'refs/heads/master' || $GITHUB_REF == 'refs/heads/main' ]]; then
            TAGS="${TAGS},${DOCKER_IMAGE}:latest,${DOCKER_IMAGE}:${{ github.sha }}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "image=${DOCKER_IMAGE}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=MSpreadEngine
            org.opencontainers.image.description=MSpread malware simulation engine backend
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create SBOM
        if: github.event_name == 'push'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.image }}:latest
          format: spdx-json
          output-file: sbom-spdx.json

      - name: Upload SBOM
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v3
        with:
          name: sbom-spdx
          path: sbom-spdx.json
